services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wms_order_lifecycle
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms_order_lifecycle"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      WMS_ENVIRONMENT: docker
      WMS_LOG_LEVEL: INFO
      WMS_DATABASE_URL: postgresql+psycopg://wms:wms@postgres:5432/wms_order_lifecycle
      WMS_DATABASE_ECHO: "false"
      WMS_DATABASE_AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
